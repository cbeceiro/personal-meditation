<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="T-med">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <title>T-med</title>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>T-med</h1>
        <p class="lema">Tailored meditations</p>
      </div>
      <button id="salir" hidden>Salir</button>
    </header>
    <p id="estado" role="status"></p>

    <form id="acceso" hidden>
      <label>Usuario
        <input id="usuario" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </label>
      <label>Contraseña
        <input id="clave" type="password" autocomplete="current-password" required>
      </label>
      <button id="entrar">Entrar</button>
    </form>

    <ul id="lista"></ul>
  </main>

  <section id="reproductor" hidden aria-label="Reproductor">
    <h2 id="titulo-actual"></h2>
    <input id="progreso" type="range" min="0" max="100" value="0" step="1" aria-label="Posición">
    <div class="tiempos"><span id="transcurrido">0:00</span><span id="restante">0:00</span></div>
    <div class="controles">
      <button id="atras" aria-label="Retroceder 15 segundos">−15</button>
      <button id="play" class="principal" aria-label="Reproducir">▶</button>
      <button id="adelante" aria-label="Avanzar 15 segundos">+15</button>
    </div>
  </section>

  <audio id="audio" preload="metadata"></audio>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
